name: Executar Automacao YouTube

on:
  # Permite disparar manualmente na aba Actions do GitHub
  workflow_dispatch:

  # Executa automaticamente todos os dias às 05:00 da manhã (Horário de Brasília)
  # O horário da cota do YouTube reseta por volta das 04:00 AM / 05:00 AM BRT
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório
      - name: Baixar repositório
        uses: actions/checkout@v4

      # 2. Configura a versão do Python no ambiente do GitHub
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala as bibliotecas necessárias
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      # 4. Reconstrói os arquivos de credenciais a partir dos Secrets do GitHub
      - name: Criar arquivos de credenciais
        env:
          CLIENT_SECRET_CONTENT: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_CONTENT: ${{ secrets.TOKEN_JSON }}
        run: |
          echo "$CLIENT_SECRET_CONTENT" > client_secret.json
          echo "$TOKEN_CONTENT" > token.json

      # 5. Executa a sua automação
      - name: Rodar script de automação
        run: |
          python automacao_youtube.py
